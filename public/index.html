<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Examination Platform | Proctoring & Assessment Engine</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    /* Print Styles for Certificate / Scorecard */
    @media print {
      body * {
        visibility: hidden;
      }
      #main-content, #main-content * {
        visibility: visible;
      }
      #main-content {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Root Application Mount Point -->
  <div id="app-root" class="min-h-full flex flex-col">
    <!-- Initial Loading State -->
    <div class="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-4">
      <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white text-3xl shadow-xl shadow-indigo-500/30 animate-pulse mb-4">
        <i class="fas fa-graduation-cap"></i>
      </div>
      <h2 class="text-white text-xl font-black">Loading Exam Shield...</h2>
      <p class="text-slate-400 text-xs mt-1">Initializing Anti-Cheating & Assessment Platform</p>
    </div>
  </div>

  <!-- Application Scripts -->
  <script src="/js/proctor.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
